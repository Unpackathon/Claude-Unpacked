         travel outbound in a Referer header. Page-level so both the
         authorized view and the request-access error state are covered. -->

    <!--
      ion-edge HTMLRewriter appends <link rel="preconnect"> here for the
      per-frame user-content host, and CF emits the same as a Link: header

         theme axes (desktop preload or ?m/d/p/f params) apply on first
         paint. data-embedded is also set when parent and top are both
         same-origin (claude.ai iframing itself, e.g. the Cowork drawer).
         The embed check must never read parent/top location: Firefox reports
         the caught cross-origin SecurityError to window.onerror anyway
         (Sentry FRAME-SHELL-N), so it decides from ancestorOrigins
         (Chromium/WebKit — [0] is the parent, the last entry is top) or,
         in Firefox (no ancestorOrigins), from the referrer origin, which
         names the embedding document and so can vouch only for the
         immediate parent — hence the parent === top gate. Cross-origin
         ancestors, an opaque (sandboxed-iframe) origin, and an empty
         referrer all land on not-embedded, exactly like the old catch
         path. The page's frame-ancestors CSP (ion-edge frame-shell.ts)
         admits 'self' plus the Chrome extension's origins (at /view, Slack's
         hosts instead), so cross-origin ancestors do load: the extension's side
         panel above claude.ai/cic above this shell. There this script lands on
         not-embedded, but ion-edge (frame-shell.ts isSameOriginIframeLoad)
         also bakes data-embedded into <html> from the browser-set fetch
         metadata, which is computed from the initiator (the claude.ai
         parent), so the shell still boots embedded; this script only ever
         SETS the attribute, so the two compose. What keeps a cross-origin
         top out of the host-tools handoff is not the stamp but the
         handoff's own check that a port comes from the parent and from
         this document's origin (packages/frame-shell/src/hostTools.ts
         onWindowMessage). The nested-shell check reads the parent only
         through window.frameElement, which is null — never a throw —
         whenever the framing document is not same-origin, in every engine,
         so it needs neither ancestorOrigins nor a parent.location read.
         This page's inline scripts must stay inline, in the head, and
         on the built document's first line, and the __frameInlineProbe
         assignment must stay their first statement: telemetry.ts's
         `injected` heuristic treats the served column that Error's
         stack reports (no first-party line-1 frame can sit left of it)
         and the width the scripts occupy (stamped at build by
         frameShell, which fails the build otherwise) as the only place
         a first-party line-1 frame can live. -->

      window.__frameInlineProbe = new Error();
      (function (ds, p, q) {
        // A reload of an app tab whose URL is masked as this artifact's link goes
        // back to the app page under the mask. sync: settleMaskedEntryOnLoad.ts

          var hs = window === top && history.state,
            tl = hs && hs.__tempLocation;

            if (real.origin === location.origin) {
              location.replace(real.href);
              ds.leaving = "";

            // claude.ai's own page for an artifact shares this address, so its reload lands here; ion-edge leaves the address with a
            // trailing slash to the app. sync: artifactAppPageMark.ts, dropArtifactPageSlashOnLoad.ts

            if (
              !(nav ? nav.type === "reload" : performance.navigation.type === 1)
            )

              ds.frameUuid &&
              sessionStorage.getItem("artifact-app-page") ===
                ds.frameUuid.toLowerCase() &&
              !q.has("standalone") &&
              !q.has("chrome")

              // A mask with a __tempKey can show /docs/x in the bar while the app's page is at tl.pathname, /artifact/x.
              var at = /^\/(?:code\/)?artifact\/[\w-]+$/.exec(

                ),
                org = hs && hs.__frameLinkOrg;

                // The app keeps a link's organization in the entry's state, which a replace drops.
                if (typeof org === "string" && !q.has("org")) q.set("org", org);
                var s = "" + q;
                location.replace(at[0] + "/" + (s && "?" + s) + location.hash);
                ds.leaving = "";
              }
            }
            // Back from the app's page to this one, kept in the back/forward cache, runs no script.
            window.addEventListener("pageshow", function (e) {
              try {
                if (e.persisted) sessionStorage.removeItem("artifact-app-page");
              } catch {}
            });
          }
        } catch {}

        // ion-edge writes data-ad-click-params only where FRAME_SEARCH_AD_FRAGMENT is on.
        try {
          var ad = ds.adClickParams && ds.adClickParams.split(" "),
            moved = 0;
          if (
            ad &&
            window === top &&
            !p &&
            !("leaving" in ds) &&
            !ad.some(function (name) {
              return q.has(name);
            })
          ) {
            location.hash.split(/[#?&]/).forEach(function (kv) {
              var i = kv.indexOf("=");
              if (
                i > 0 &&
                kv.length > i + 1 &&
                ad.indexOf(kv.slice(0, i)) >= 0

                q.set(
                  kv.slice(0, i),
                  kv
                    .slice(i + 1)
                    .replace(/[^\w.-]/g, "")
                    .slice(0, 256),

                moved = 1;
              }
            });

              location.replace(location.origin + location.pathname + "?" + q);
              ds.leaving = "";
            }
          }

        if (p?.embedded && p.platform !== "desktop" && q.has("invite"))
          ds.inviteHold = q.get("invite");

          var o = location.origin,
            ao = location.ancestorOrigins;
          if (ao) {
            if (ao[0] === o && ao[ao.length - 1] === o) ds.embedded = "";

            try {
              // URL() throws only TypeError (malformed referrer) — inert
              // to the Firefox onerror quirk, which is SecurityError-only.

          // data-frame-uuid): booting would recurse. sync: shell.ts nestedInShell

            var fe = window.frameElement;

              fe &&
              fe.ownerDocument.documentElement.hasAttribute("data-frame-uuid")

              ds.nested = "";
          } catch {}

        // entirely — for hosts that draw their own panel chrome (Share +
        // attribution). Honored ONLY when the embed marker is already set,
        // so a top-level link can't strip the header by appending the param.
        if ("embedded" in ds && (p?.chrome ?? q.get("chrome")) === "none") {

            .querySelector("meta[name=viewport]")
            .setAttribute(

              "width=device-width,initial-scale=1,viewport-fit=cover",

        // tokens). "comment-mode": the host declares it draws the
        // comment-mode control, which suppresses the shell's floating
        // comment-mode toggle (Comments.tsx hostDrawsCommentMode).
        // "comments-list": the host also draws its own entry to the
        // all-comments list, which suppresses the shell's floating
        // "All comments" chip (Comments.tsx hostDrawsCommentsList).

        // new-comment composer and posts the comment itself; the shell mounts none

        // comments panel (headless comments), so the shell may adopt an
        // open the page declares into the forwarded mode and echo it
        // pressed (Comments.tsx hostSeatsPageComments); a host without

        // "viewer-context": the shell forwards the viewer's own room
        // presence (less cursor and name) to the host (viewerContext.ts).
        // "context-card": the host stages a page's gestured "Ask Claude"

        // "context-send": the host stages a page's room sendToClaudeSession

        // "context-send-held": what that host stages waits for the viewer's own

        // "chrome": on a chrome=none embed the host

        // comment count and declared header actions (chromeReport.ts
        // lane) — to draw in its header, and may post a declared
        // action's id back down the same lane.
        // "export": with "chrome", the host also receives the page's
        // declared export formats in that snapshot and may ask for one
        // (chromeReport.ts exportCommand) — the viewer confirms in the
        // shell, naming the host's destination, before any bytes reach

        // byte-identical snapshots.
        // "page-foot": with "chrome", the host floats a control of its

        // floats nothing sees byte-identical snapshots and none for a
        // change of those two alone.
        // "header": on a chrome=none embed the host draws the title row

        // attribution verdict, status pills, the artifact's menu rows and
        // version list (chrome/hostHeader.ts) — and may ask the shell to
        // open its viewer share sheet, Report, Permissions or Activity
        // dialog in place.
        // "duplicate": with "header", the host runs Duplicate when that

        // "report": on a chrome=none embed the host draws its own Report item

        // "viewer-share": on a chrome=none embed, the host's share command also opens the read-only viewer sheet for a viewer who cannot manage a person's artifact's sharing.
        // "sheet-arrow": on a chrome=none embed the host draws the share
        // sheet's arrow inside its own header band; the shell hangs the
        // sheet just under its top edge and echoes the sheet's box and
        // hairline row (chrome/hostSheet.ts) so arrow and sheet read as
        // one popover the artifact cannot imitate.
        // "sheet-backdrop": with "sheet-arrow", "header" and "chrome", the host dims that band while the echo says open with no box and
        // draws the title menu's Export row; only then does the shell open Export in a dialog (BRIDGE.md "Header echo").
        // "sheet-scrim": the host hears the Share sheet open and close, and dims its chrome while the echo says open with no box (BRIDGE.md "Host-chrome commands").
        // "chrome-readonly": with "chrome", the host declares its header
        // words the page's reported read-only state; the shell forwards
        // the word to the page on its re-report poke (chromeReport.ts,
        // BRIDGE.md "Words the chrome draws") so the page may fold its
        // own read-only chip. One token per word the host draws.
        // "selection-menu": a native host draws the OS text-selection

        // declared-actions lane's narrow key (chromeReport.ts
        // selectionMenuOnly: declaration-only relay, no page chrome). Also,
        // from a top-level native host only, a word token: forwarded on the
        // poke as selection_menu so a page declaring that id may fold its
        // own toolbar's Comment.
        // "page-list-row": a top-level native host draws a row for a page's
        // declared open_page_list action; forwarded on the poke as page_list_row so a
        // page declaring that id may fold its own control for that list.
        // "leave-loses-work": with "selection-menu" and without "chrome", the host's
        // copy of the snapshot also carries leaveLosesWork (chromeReport.ts withWork).
        // "chat-beside": with "chrome", the host's pane sits beside a
        // claude.ai conversation the viewer has not put away (the chat
        // drawer, re-stamped live as the chat is put away or restored);
        // forwarded on the poke as the word chat_beside so a page may
        // fold its own ask-Claude entry.
        // "chat-toggle", "chat-draft": declared live only, never here (BRIDGE.md § Chat toggle, § Page comment control).
        // "f6-stop": declared live only, never here (BRIDGE.md § Host shortcuts).
        // "chat-rung": declared live only, never here (BRIDGE.md § Host-chrome commands).
        // "menu-cut", "bar-tip": declared live only, never here (BRIDGE.md § Menu cut, § Bar tip).
        // "schedule-updates", "schedule-offer": declared live only, never here (BRIDGE.md § Schedule updates).
        // "doc-start-layout": declared live only, never here (BRIDGE.md § Doc start).
        // "click-edit-fresh": declared live only, never here (BRIDGE.md § Click to edit).
        // "claude-file-computer", "claude-file-drive": declared live only, never here (BRIDGE.md § File for Claude).
        // "chat-in-view": declared live only, never here (BRIDGE.md § Chat in view).
        // "turn-into": declared live only, never here (BRIDGE.md § Turn into).
        // "header-controls", "top-edge": declared live only, never here (BRIDGE.md § Header controls, § Top edge).

        // channel's validated presence roster (presenceRelay.ts) to
        // draw the facepile the shell draws on standalone boots.
        // "host-nav": on a chrome=none embed the host is offered link
        // clicks that pass handleNav's gates (deferred.ts offerHostNav)
        // and may claim them to open in-app; unclaimed clicks fall
        // through unchanged.
        // "host-tools": the host may hand the shell document a
        // MessagePort for host: mcp servers (hostTools.ts); the stamp
        // alone grants nothing — without the handoff it is inert.

        // page's current Copy-link fragment (anchorRelay.ts) to reflect

        // needs no token.

        // told which edges to extend its web view under (hostLayout.ts).

        // "edge-to-edge-top-checked": beside "edge-to-edge": a page that answers clear of the top runs beneath it; see hostLayout.ts

        // "host-loader": the host shows its own loader behind the web view (BRIDGE.md § Host layout).

        // a wheel the artifact cannot use chains out to it (shell.css).
        // "save-file": on a chrome=none embed the host, not the shell, writes

        // "save-blob": the same, but the file goes to the same-origin parent
        // page as one Blob and that page starts the browser download

        // (a composed page gets its table as data-hostkeys from the edge instead).
        // "device-*": the marker host can honor that device capability, counted
        // only under data-host (BRIDGE.md § Native hosts).
        // "read-aloud": the marker host lets the shell speak; counted only under data-host (BRIDGE.md § Read aloud).
        // "transparent", "host-messages": an overlay page over the host, trading
        // messages with it (BRIDGE.md § Host messages; needs hostOverlayEnabled).

        // toggles shell UI, rewords a hint, keeps a nav inside an opted-in
        // pane, answers the pane's same-origin host with the viewer's own

        // their own gesture, the page's own header facts or facts of
        // the page's own layout, the room's presence roster, or a file
        // they confirmed saving, tells the page facts of the host's
        // layout, lets a wheel the artifact cannot use
        // scroll the host's page, lets the host offer a bridge the shell
        // still pins, names the host's device capabilities or read-aloud, relays overlay messages, or accepts the viewer's own invitation);

        // it; its query is never a declaration, except the one token each
        // pre-member host build put there (the desktop pane's host-tools,
        // the mobile viewers' comment-mode). Same-origin iframe hosts have
        // no marker and declare in the query.

            ? q.get("hostcaps")

                t === "comments-list" ||
                t === "comment-composer" ||
                t === "comment-threads" ||
                t === "page-comments" ||
                t === "artifact-nav" ||
                t === "artifact-nav-vanity" ||
                t === "comment-summon" ||
                t === "open-in-claude" ||
                t === "open-chat" ||
                t === "stage-in-chat" ||
                t === "cloud-session" ||
                t === "cowork-task" ||
                t === "no-send-all" ||
                t === "summon-into-chat" ||
                t === "summon-into-session" ||
                t === "summon-into-channel" ||
                t === "connector-off" ||
                t === "confirm-page-sends" ||
                t === "viewer-context" ||
                t === "chrome" ||
                t === "export" ||
                t === "page-foot" ||
                t === "foot-bar-hidden" ||
                t === "chrome-readonly" ||
                t === "selection-menu" ||
                t === "page-list-row" ||
                t === "leave-loses-work" ||
                t === "chat-beside" ||
                t === "header" ||
                t === "duplicate" ||
                t === "report" ||
                t === "viewer-share" ||
                t === "sheet-arrow" ||
                t === "sheet-backdrop" ||
                t === "sheet-scrim" ||
                t === "presence" ||
                t === "host-tools" ||
                t === "context-card" ||
                t === "context-send" ||
                t === "vouched-send" ||
                t === "context-send-held" ||
                t === "host-nav" ||
                t === "url-anchor" ||
                t === "edge-to-edge" ||
                t === "edge-to-edge-top-checked" ||
                t === "edge-to-edge-sides" ||
                t === "keyboard-done" ||
                t === "invite-offer" ||
                t === "page-background" ||
                t === "content-height" ||
                t === "host-loader" ||
                t === "scroll-chain" ||
                t === "save-file" ||
                t === "save-blob" ||
                t === "host-keys" ||
                t === "device-camera" ||
                t === "device-microphone" ||
                t === "device-speech" ||
                t === "device-geolocation" ||
                t === "device-motion" ||
                t === "device-screenshare" ||

  <body>
    <!-- Keep this first in body: it is empty and paints behind the header.
         shell.css, #top-edge, says why it exists. -->
    <div id="top-edge" aria-hidden="true"></div>
    <!-- Skeleton loading state; the lazy chrome chunk mounts on #hdr and
         replaces ALL children in one React commit. The hidden sibling is
         the degraded fallback (outside #hdr so a successful React mount
         can't remove it before a later render error). -->
    <!-- Named + programmatically focusable: an unclaimed Escape inside the
         artifact lands keyboard focus here on a standalone page (BRIDGE.md
         § Escape to chrome), announced as "Artifact controls,
         banner" rather than a nameless landmark. -->
    <header id="hdr" tabindex="-1" aria-label="Artifact controls">
      <span class="skel skel-home" aria-hidden="true"></span>
      <div class="l" aria-hidden="true">
        <span class="skel skel-title"></span>
      </div>
      <div class="r" aria-hidden="true">
        <span class="skel skel-avatar"></span>
      </div>
    </header>
    <div id="hdr-degraded">
      <span class="degraded-title"></span>
      <span class="byline">Content is user-generated and unverified.</span>
    </div>
    <main>
      <!--
        ion-edge HTMLRewriter sets data-frame-{uuid,uchost} on #frame-slot
        (the only per-request data the worker touches — uuid is from the URL,
        uchost is uuid + a config literal). shell.ts reads them post-parse,
        fetches /api/frame/{uuid} via the scriptless /api/ route, and builds
        the iframe via DOM APIs.
      -->
      <div id="frame-slot">
        <div id="loading">
          <div
            class="loading-status"
            role="status"
            aria-label="Loading"
            tabindex="-1"
          ></div>
        </div>
      </div>
    </main>
    <div id="err" hidden></div>
  </body>
</html>
